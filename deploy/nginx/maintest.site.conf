# maintest.site — GardenHouse under /gardenhouse
#
# Before SSL: HTTP only (port 80).
# After `deploy/setup_ssl.sh`, certbot adds 443 and HTTP→HTTPS redirect.
#
# Routing:
#   /gardenhouse/api/     → Django Gunicorn  :8000/api/   (prefix stripped)
#   /gardenhouse/admin/   → Django Gunicorn  :8000/admin/
#   /gardenhouse/static/  → collected static files
#   /gardenhouse/media/   → uploaded media
#   /gardenhouse/*        → Next.js           :3000  (basePath + next-intl ru/en)

server {
    listen 80;
    listen [::]:80;
    server_name maintest.site www.maintest.site 193.181.216.124;

    client_max_body_size 20m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Domain root → app
    location = / {
        return 301 /gardenhouse;
    }

    # Safety net: bare static files without /gardenhouse prefix
    location ~* ^/(?!gardenhouse|api|admin|static|media|_next|\.well-known)([^/]+\.(?:jpg|jpeg|png|gif|webp|svg|mp4|webm|mov|woff2?|ttf|otf|ico|avif|pdf))$ {
        return 301 /gardenhouse/$1;
    }

    # --- Django API (strip /gardenhouse) ---
    location ^~ /gardenhouse/api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- Django Admin ---
    location ^~ /gardenhouse/admin/ {
        proxy_pass http://127.0.0.1:8000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Django static (collectstatic) ---
    # NOTE: trailing slash on alias path is required
    location ^~ /gardenhouse/static/ {
        alias __APP_DIR__/backend/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- Django media ---
    location ^~ /gardenhouse/media/ {
        alias __APP_DIR__/backend/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # --- Next.js (pages, _next, public, next-intl) ---
    # Do NOT force trailing slash — next-intl redirects /gardenhouse → /gardenhouse/ru
    location ^~ /gardenhouse {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
