# maintest.site — shared test domain
# GardenHouse is served under the /gardenhouse sub-path.
#
# Public URLs:
#   https://maintest.site/gardenhouse        → Next.js (next-intl → /gardenhouse/ru)
#   https://maintest.site/gardenhouse/en/... → English locale
#   https://maintest.site/gardenhouse/api/   → Django (prefix stripped)
#   https://maintest.site/gardenhouse/admin/ → Django admin
#   https://maintest.site/gardenhouse/media/ → uploaded files
#
# Before SSL: this single server block serves the app over plain HTTP.
# After `certbot --nginx -d maintest.site --redirect` runs, certbot adds a
# 443 listener and inserts the 80 → 443 redirect automatically.

server {
    listen 80;
    listen [::]:80;
    server_name maintest.site 193.181.216.124;

    # Let's Encrypt HTTP-01 challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Domain root → the app. Without this, opening https://maintest.site/
    # returns nginx's default 404 instead of the storefront.
    location = / {
        return 301 /gardenhouse;
    }

    # Raw static assets requested WITHOUT the /gardenhouse prefix.
    # Next.js basePath rewrites paths only for next/image, next/link and
    # /_next/* — plain <img>/<video>/<source> tags and @font-face url()
    # still emit URLs like /video.mp4, /poster.jpg or /font.woff2.
    # This rule 301s them into the app sub-path so they resolve from public/.
    location ~* ^/(?!gardenhouse|api|admin|static|media|_next|\.well-known)([^/]+\.(?:jpg|jpeg|png|gif|webp|svg|mp4|webm|mov|woff2?|ttf|otf|ico|avif|pdf))$ {
        return 301 /gardenhouse/$1;
    }

    # --- Django API (sub-path stripped) ---
    # More specific than the Next.js catch-all below. Trailing URI on
    # proxy_pass strips /gardenhouse so Gunicorn sees /api/...
    location ^~ /gardenhouse/api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- Django Admin (sub-path stripped) ---
    location ^~ /gardenhouse/admin/ {
        proxy_pass http://127.0.0.1:8000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Django static files (collectstatic) ---
    location ^~ /gardenhouse/static/ {
        alias /var/www/gardenhouse/backend/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- Django media files (uploads) ---
    location ^~ /gardenhouse/media/ {
        alias /var/www/gardenhouse/backend/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- Next.js frontend (pages, _next/static, public/, next-intl) ---
    # NOTE: no forced trailing-slash redirect here. next-intl already
    # normalizes /gardenhouse → /gardenhouse/ru; forcing "/gardenhouse/"
    # from nginx caused an endless redirect loop.
    location ^~ /gardenhouse {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
