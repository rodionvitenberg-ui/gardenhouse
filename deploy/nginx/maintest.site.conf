# maintest.site — shared test domain
# GardenHouse is served under the /gardenhouse sub-path.
#
# Before SSL: this single server block serves the app over plain HTTP.
# After `certbot --nginx -d maintest.site --redirect` runs, certbot adds a
# 443 listener and inserts the 80 → 443 redirect automatically.

server {
    listen 80;
    listen [::]:80;
    server_name maintest.site 193.181.216.124;

    # Let's Encrypt HTTP-01 challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- Next.js frontend ---
    # NOTE: no forced trailing-slash redirect here. Next.js (next-intl
    # middleware) already normalizes the path (e.g. /gardenhouse →
    # /gardenhouse/ru); forcing "/gardenhouse/" from nginx caused an endless
    # redirect loop. The ^~ prefix matches both /gardenhouse and
    # /gardenhouse/... ; more specific prefixes (api/admin/media/static)
    # below take precedence because they are longer matches.
    location ^~ /gardenhouse {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # --- Django API (sub-path stripped) ---
    location /gardenhouse/api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Django Admin (sub-path stripped) ---
    location /gardenhouse/admin/ {
        proxy_pass http://127.0.0.1:8001/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Django static files (collected) ---
    location /gardenhouse/static/ {
        alias /var/www/gardenhouse/backend/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- Django media files (uploads) ---
    location /gardenhouse/media/ {
        alias /var/www/gardenhouse/backend/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}